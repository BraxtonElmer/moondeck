<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moondeck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="out">
  <main id="stage">
    <header id="top" class="frost"></header>
    <section id="cmd" class="frost" hidden></section>
    <button id="settings" class="frost round" data-act="settings" aria-label="Settings"></button>
    <section id="sheet" class="frost" hidden role="dialog" aria-label="Settings"></section>

    <aside id="left" class="frost card"></aside>
    <aside id="right" class="frost card"></aside>

    <section id="pop" class="frost" hidden></section>
    <div id="toast" hidden></div>
    <nav id="deck" class="frost"></nav>

    <p id="hint"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
